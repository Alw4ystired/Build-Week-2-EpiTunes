<!DOCTYPE html>
<html lang="it" data-bs-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EpiTunes — Cerca</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/app.css" />
</head>

<body>
  <div class="app d-grid vh-100">
    <aside class="sidebar d-none d-sm-block py-4 px-3 overflow-y-auto"></aside>

    <main class="main overflow-y-auto position-relative">
      <header class="topbar sticky-top d-flex align-items-center justify-content-between border-bottom py-3 px-3 px-md-4">
        <div class="topbar-nav d-flex gap-2">
          <button id="btn-indietro" class="nav-btn rounded-circle border-0 lh-1 fs-5" aria-label="Indietro">‹</button>
          <button id="btn-avanti" class="nav-btn rounded-circle border-0 lh-1 fs-5" aria-label="Avanti">›</button>
        </div>
        <div class="user-pill rounded-pill fw-semibold">Studente Epicode</div>
      </header>

      <section class="search pt-4 pb-5 px-3 px-md-4">
        <div class="search-box position-relative mt-2 mb-3">
          <input type="text" id="search-input" class="search-input rounded-pill w-100 fs-6"
            placeholder="Cerca un brano, un album, un artista..." autocomplete="off" />
        </div>

        <!--
            COSTRUISCI IN search.js:
            - Debounce 400ms su "input" -> chiamata fetch a iTunes search
            - Tre sezioni: brani, album, artisti (Promise.all con entity differenti)
            - Salva ultima query in localStorage; al caricamento, riprendila
            - Click su brano -> Player; click su album/artist -> album.html/artist.html?id=...
          -->
        <div class="search-results">
          <section class="mt-4" id="row-tracks" hidden>
            <h2 class="fs-4 fw-bold mb-3">Brani</h2>
            <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-xl-6 g-3" id="grid-tracks"></div>
          </section>
          <section class="mt-4" id="row-albums" hidden>
            <h2 class="fs-4 fw-bold mb-3">Album</h2>
            <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-xl-6 g-3" id="grid-albums"></div>
          </section>
          <section class="mt-4" id="row-artists" hidden>
            <h2 class="fs-4 fw-bold mb-3">Artisti</h2>
            <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-xl-6 g-3" id="grid-artists"></div>
          </section>
        </div>
      </section>
    </main>

    <footer class="player d-grid align-items-center"></footer>
  </div>

  <audio id="audio-element"></audio>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.min.js"
    integrity="sha384-89aa4glufciPv46aKltztWQEmk+Tu9W2RhzXr6VcnUUEub7F8+06RcL2RYLCOHUq"
    crossorigin="anonymous"></script>

  <script type="module" src="assets/js/search.js"></script>
</body>

</html>
