<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EpiTunes — Album</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/app.css" />
</head>

<body>
  <div class="app">
    <aside class="sidebar"></aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-nav">
          <button class="nav-btn" aria-label="Indietro">‹</button>
          <button class="nav-btn" aria-label="Avanti">›</button>
        </div>
        <div class="user-pill">Studente Epicode</div>
      </header>

      <!--
          COSTRUISCI IN album.js:
          - Leggi l'id dalla query string con URLSearchParams
          - fetch lookup?id=NNN&entity=song
          - Primo risultato = collection (album), gli altri = tracks
          - Hero: cover grande + titolo album + artista + anno + numero brani
          - Tracklist: lista numerata di brani con titolo + durata; click su brano -> Player
        -->
      <section class="album-page">
        <div class="album-hero" id="album-hero"></div>
        <div class="tracklist" id="tracklist"></div>
      </section>
    </main>

    <footer class="player"></footer>
  </div>

  <audio id="audio-element"></audio>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.min.js"
    integrity="sha384-89aa4glufciPv46aKltztWQEmk+Tu9W2RhzXr6VcnUUEub7F8+06RcL2RYLCOHUq"
    crossorigin="anonymous"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/album.js"></script>
</body>

</html>
